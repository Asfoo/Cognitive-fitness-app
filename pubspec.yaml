name: cognitive_fitness_app
description: "Cognitive fitness assessment: reaction, dual-task and biofeedback tests with progress reports."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  fl_chart: ^1.3.0
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/beep_high.mp3
    - assets/beep_low.mp3
